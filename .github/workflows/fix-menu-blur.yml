name: Remove mobile menu blur

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'fix: remove menu blur') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove backdrop blur from mobile menu overlay
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/routes/index.tsx')
          text = path.read_text(encoding='utf-8')
          old = 'bg-black/60 backdrop-blur-[2px]'
          new = 'bg-black/60'
          if old not in text:
              raise SystemExit('Target blur class not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-menu-blur.yml
          git add src/routes/index.tsx
          git commit -m "fix: remove menu blur"
          git push
